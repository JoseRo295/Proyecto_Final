<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | MiTienda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <nav class="navegacion">
            <a href="index.html" class="logo">Mi<span>Tienda</span></a>
            <ul class="lista_navegacion">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="enlace_carrito" class="oculto"><a href="carrito.html">Carrito</a></li>
                <li id="enlace_pedidos" class="oculto"><a href="pedidos.html">Mis pedidos</a></li>
                <li id="enlace_admin" class="oculto"><a href="admin.html">Administrar</a></li>
                <li id="enlace_login"><a href="login.html">Iniciar sesión</a></li>
                <li id="enlace_registro"><a href="registro.html">Registrarse</a></li>
            </ul>
            <div id="sesion" class="sesion oculto">
                <span id="usuario_nombre"></span>
                <button id="boton_salir" class="boton boton_pequeno">Cerrar sesión</button>
            </div>
        </nav>
    </header>

    <main class="contenido">
        <section class="portada">
            <h1>Bienvenido a MiTienda</h1>
            <p>Laptops, celulares, artículos para el hogar y deportes en un solo lugar.</p>
            <form class="buscador" action="catalogo.html">
                <input type="search" name="buscar" placeholder="¿Qué estás buscando?" required>
                <button type="submit" class="boton boton_blanco">Buscar</button>
            </form>
        </section>

        <section class="seccion">
            <h2 class="titulo_seccion">Productos destacados</h2>
            <p id="mensaje_destacados" class="mensaje"></p>
            <div id="lista_destacados" class="lista_productos"></div>
        </section>

        <section class="seccion">
            <h2 class="titulo_seccion">Categorías</h2>
            <div id="lista_categorias" class="lista_categorias"></div>
        </section>
    </main>

    <footer class="pie">
        <p>MiTienda - Proyecto Final UIDE</p>
    </footer>

    <script src="js/comun.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
