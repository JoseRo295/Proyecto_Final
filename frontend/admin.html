<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | MiTienda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <nav class="navegacion">
            <a href="index.html" class="logo">Mi<span>Tienda</span></a>
            <ul class="lista_navegacion">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="enlace_carrito" class="oculto"><a href="carrito.html">Carrito</a></li>
                <li id="enlace_pedidos" class="oculto"><a href="pedidos.html">Mis pedidos</a></li>
                <li id="enlace_admin" class="oculto"><a href="admin.html">Administrar</a></li>
                <li id="enlace_login"><a href="login.html">Iniciar sesión</a></li>
                <li id="enlace_registro"><a href="registro.html">Registrarse</a></li>
            </ul>
            <div id="sesion" class="sesion oculto">
                <span id="usuario_nombre"></span>
                <button id="boton_salir" class="boton boton_pequeno">Cerrar sesión</button>
            </div>
        </nav>
    </header>

    <main class="contenido">
        <h1 class="titulo_seccion">Panel de administración</h1>

        <section class="seccion">
            <h2 class="titulo_seccion">Categorías</h2>
            <div class="panel_admin">
                <form id="formulario_categoria" class="formulario tarjeta_formulario">
                    <h3 id="titulo_categoria">Nueva categoría</h3>
                    <label for="categoria_nombre">Nombre</label>
                    <input type="text" id="categoria_nombre" minlength="2" required>

                    <label for="categoria_descripcion">Descripción</label>
                    <textarea id="categoria_descripcion" rows="2"></textarea>

                    <div class="acciones">
                        <button type="submit" class="boton">Guardar</button>
                        <button type="button" id="cancelar_categoria" class="boton boton_gris oculto">Cancelar</button>
                    </div>
                    <p id="mensaje_categoria" class="mensaje"></p>
                </form>
                <div id="lista_categorias"></div>
            </div>
        </section>

        <section class="seccion">
            <h2 class="titulo_seccion">Productos</h2>
            <div class="panel_admin">
                <form id="formulario_producto" class="formulario tarjeta_formulario">
                    <h3 id="titulo_producto">Nuevo producto</h3>
                    <label for="producto_nombre">Nombre</label>
                    <input type="text" id="producto_nombre" minlength="2" required>

                    <label for="producto_descripcion">Descripción</label>
                    <textarea id="producto_descripcion" rows="2"></textarea>

                    <label for="producto_precio">Precio ($)</label>
                    <input type="number" id="producto_precio" step="0.01" min="0.01" required>

                    <label for="producto_stock">Stock</label>
                    <input type="number" id="producto_stock" step="1" min="0" required>

                    <label for="producto_imagen">Ruta de la imagen</label>
                    <input type="text" id="producto_imagen" placeholder="Assets/laptops/macbook_pro.webp" required>

                    <label for="producto_categoria">Categoría</label>
                    <select id="producto_categoria" required></select>

                    <div class="acciones">
                        <button type="submit" class="boton">Guardar</button>
                        <button type="button" id="cancelar_producto" class="boton boton_gris oculto">Cancelar</button>
                    </div>
                    <p id="mensaje_producto" class="mensaje"></p>
                </form>
                <div id="lista_productos"></div>
            </div>
        </section>

        <section class="seccion">
            <h2 class="titulo_seccion">Pedidos registrados</h2>
            <p id="mensaje_pedidos" class="mensaje"></p>
            <div id="lista_pedidos"></div>
        </section>
    </main>

    <footer class="pie">
        <p>MiTienda - Proyecto Final UIDE</p>
    </footer>

    <script src="js/comun.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
